name: Security Review & SAST Audits

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python (for reports generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-fs-report.txt'
        continue-on-error: true

      - name: Run Semgrep SAST Scanner
        run: |
          pip install semgrep
          semgrep --config=auto . --text || echo "Semgrep scan finished"
        continue-on-error: true

      - name: Compile and run backend unit tests
        run: |
          cd backend
          mvn test

      - name: Generate styled Excel sheets & Inventory reports
        run: |
          python automation/generate_all_excel_sheets.py

      - name: Upload Security Reports & Excel Inventories
        uses: actions/upload-artifact@v4
        with:
          name: Security-Audit-Inventories
          path: |
            Vulnerability Test Results/
            trivy-fs-report.txt
          retention-days: 30

      - name: Verify build pass/fail criteria
        run: |
          # Pipeline fails only when critical vulnerabilities are logged in security report
          if grep -q "Critical" "Vulnerability Test Results/findings.xlsx" 2>/dev/null; then
            echo "Critical vulnerabilities detected. Blocking build."
            exit 1
          else
            echo "Security verification completed successfully."
          fi
