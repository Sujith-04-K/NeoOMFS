# ============================================================
# NeoOMFS Backend - Application Configuration
# Spring Boot 3.2.x | Java 17
# ============================================================

# =========================
# Server
# =========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# =========================
# Database (Default H2 In-Memory with MySQL compatibility, override with DB_URL for MySQL)
# =========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:neoomfsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER,ROLE,ROLES,KEY,VALUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# =========================
# Hikari Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================
# JPA & Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================
# JWT Configuration
# =========================
jwt.secret=${JWT_SECRET:NeoOMFSSecretKeyForJWTAuthenticationOfPreoperativeSurgicalFitnessAssessmentSystem2024SIMATS}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.jwt.secret=${APP_JWT_SECRET:${jwt.secret}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:${jwt.expiration-ms}}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:${jwt.refresh-expiration-ms}}

# =========================
# File Storage
# =========================
storage.upload-dir=backend/uploads
storage.reports-dir=backend/reports
storage.allowed-extensions=jpg,jpeg,png,pdf,dcm

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =========================
# Swagger
# =========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# CORS
# =========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.max-age=${CORS_MAX_AGE:3600}

# =========================
# Logging
# =========================
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:WARN}
logging.level.com.simats.neoomfs=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}


# =========================
# Email (SMTP)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:neoomfs.support@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.dev-mode=${MAIL_DEV_MODE:true}
app.mail.from=${MAIL_FROM:${spring.mail.username}}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:neoomfs://reset-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
